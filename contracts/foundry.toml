[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# test/fixtures is shared with web/ to cross-check the commitment hash (TS <-> Solidity)
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Deadlines are enforced by block.timestamp by design (see CLAUDE.md §0.4).
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 512

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
