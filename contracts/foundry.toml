# Foundry project for the BlindBid contracts. Run from contracts/, or from the repo root with
# `forge test --root contracts`. Dependencies are vendored in lib/ (no `forge install` needed);
# import paths come from remappings.txt. See README "Contract tests (Foundry)".
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
# PortaldotV3 accepts Shanghai bytecode (PUSH0); Cancun opcodes (MCOPY, TSTORE) are not relied on.
evm_version = "shanghai"
optimizer = true
# PortaldotV3 charges a storage deposit per byte of deployed code: optimise for size, not call cost.
optimizer_runs = 1
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
# test/fixtures is shared with web/ to cross-check the commitment hash (TS <-> Solidity)
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Deadlines are enforced by block.timestamp by design (see CLAUDE.md §0.4).
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 512

# Stateful suites in test/invariant: random call sequences from several actors. `runs` x `depth` calls per invariant.
[invariant]
runs = 256
depth = 128
fail_on_revert = false
show_metrics = true

# Slower, deeper run for review/CI: FOUNDRY_PROFILE=ci forge test
[profile.ci]
verbosity = 2

[profile.ci.fuzz]
runs = 10000
# Fixed so a CI failure can be replayed exactly. Change it to explore other sequences.
seed = "0x706c696e746873"

[profile.ci.invariant]
runs = 1000
depth = 128
fail_on_revert = false
show_metrics = true

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
