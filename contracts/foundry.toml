[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
# PortaldotV3 accepts Shanghai bytecode (PUSH0); Cancun opcodes (MCOPY, TSTORE) are not relied on.
evm_version = "shanghai"
optimizer = true
# PortaldotV3 charges a storage deposit per byte of deployed code: optimise for size, not call cost.
optimizer_runs = 1
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
# test/fixtures is shared with web/ to cross-check the commitment hash (TS <-> Solidity)
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Deadlines are enforced by block.timestamp by design (see CLAUDE.md §0.4).
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 512

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
